# Reference example. Copy only the parts you need into ~/.codex/config.toml. install.py does not copy this file.
# Sources: https://learn.chatgpt.com/codex/config-file/config-reference
#          https://learn.chatgpt.com/codex/agent-configuration/subagents
# Official docs checked: 2026-09-29

model = "gpt-6-sol"
model_reasoning_effort = "medium"
review_model = "gpt-6-astra"

[agents]
max_concurrent_threads_per_session = 3

# To use Astra for the main session:
#   codex --model gpt-6-astra -c 'model_reasoning_effort="high"'
# or keep a ~/.codex/<name>.config.toml file and call it with --profile <name>
# (since 0.134.0, [profiles.x] blocks in config.toml are not supported).
